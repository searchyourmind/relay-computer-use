[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "relay-computer-use"
version = "0.1.0"
description = "LLM discovery, typed capabilities, and deterministic replay on a legacy browser surface"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1", "pydantic>=2.10,<3", "httpx>=0.28,<1", "playwright>=1.50,<2", "python-multipart>=0.0.20,<1"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2"]

[tool.setuptools.packages.find]
include = ["relaycu*"]

[tool.setuptools.package-data]
relaycu = ["static/*.html", "static/*.css", "static/*.js", "static/*.svg", "static/pages/*.html"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
